# V10b: connection-ticket master key shared by all controller replicas.
#
# Generate (32+ random bytes, hex) and apply BEFORE scaling past 1 replica:
#   head -c 48 /dev/urandom | xxd -p -c 256 > ticket.key
#   kubectl -n acp-runner-system create secret generic acp-runner-ticket-key \
#     --from-file=key=./ticket.key --dry-run=client -o yaml | kubectl apply -f -
#   # controller.yaml mounts it at /run/acp-runner/ticket-key/key
#
# Rotation: create acp-runner-ticket-key-prev from the OLD key, replace `key`
# with the new one, roll the Deployment. Environments created under the old
# key stay connectable (previous key still mints for them) until they end;
# new environments use the new key. Remove -prev once no live environment
# references the old version (status never exposes it; check the journal).
apiVersion: v1
kind: Secret
metadata:
  name: acp-runner-ticket-key
  namespace: acp-runner-system
  labels: {app.kubernetes.io/name: acp-runner-controller, app.kubernetes.io/part-of: acp-runner}
type: Opaque
stringData:
  # PLACEHOLDER — replace with generated key material, never commit a real key.
  key: "REPLACE-WITH-96+-HEX-CHARS-FROM-48-RANDOM-BYTES"
